<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autobox</title>
  <link rel="stylesheet" href="css/carritoStyle.css">
</head>
<body>
  <!-- Contenido principal de prueba con el botón que abre el carrito. -->
  <main>
    <h1>Autobox</h1>
    <!-- aria-controls y aria-expanded informan sobre el panel a tecnologías de asistencia. -->
    <button class="open-cart" type="button" aria-controls="cart-frame" aria-expanded="false">
      Abrir carrito
    </button>
  </main>

  <!-- Esta capa oscurece el inicio mientras el carrito está abierto. -->
  <div class="cart-overlay" hidden></div>
  <!-- Carga carrito.html aquí para mostrarlo como panel lateral. -->
  <iframe class="cart-frame" id="cart-frame" src="carrito.html" title="Carrito de compras" aria-hidden="true"></iframe>
  <!-- La lógica que abre, cierra y sincroniza el panel está en este archivo. -->
  <script src="js/carrito.js"></script>


</body>
</html>
